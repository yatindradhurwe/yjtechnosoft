# Production-style stack: Postgres + API (with in-process worker) + web (Nginx).
# Put Caddy or host Nginx with TLS in front (see deploy/ and docs/DEPLOYMENT.md).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: creator
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator"]
      interval: 10s
      retries: 5
  api:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://creator:${POSTGRES_PASSWORD}@db:5432/creator
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on:
      db: { condition: service_healthy }
  web:
    build: ./web
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
volumes:
  pgdata:
  uploads:
